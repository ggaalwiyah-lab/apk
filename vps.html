<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPS / Hosting</title>

<!-- Font menyeramkan -->
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Nosifer&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
body{
    background:black;
    font-family:'Nosifer', cursive;
    color:#cc00ff;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-family:'Nosifer', cursive;
    color:#cc00ff;
    text-shadow:0 0 12px #cc00ff;
}

/* GRID LIST VPS */
.vps-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
}

/* CARD VPS */
.vps-card{
    background:rgba(128,0,128,0.05);
    border-radius:20px;
    box-shadow:0 0 25px rgba(200,50,255,0.5);
    text-align:center;
    padding:20px 15px;
    transition:0.3s;
    cursor:pointer;
}

.vps-card:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(200,50,255,0.8);
}

/* ICON KEREN DI ATAS */
.vps-card .vps-icon{
    font-size:50px;
    color:#cc00ff;
    margin-bottom:15px;
    text-shadow:0 0 12px #cc00ff;
}

/* NAMA VPS */
.vps-card .vps-name{
    font-weight:bold;
    margin-bottom:10px;
    font-family:'UnifrakturCook', cursive;
    color:#cc66ff;
    text-shadow:0 0 8px #cc66ff;
}

/* HARGA */
.vps-card .vps-price{
    font-weight:bold;
    margin-bottom:15px;
    font-family:'UnifrakturCook', cursive;
    color:#ffcc00;
    text-shadow:0 0 6px #ffcc00;
}

/* TOMBOL KOTAK NEON */
.vps-card a{
    display:block;
    padding:16px 10px;
    background:linear-gradient(135deg,#660066,#330033);
    color:#cc00ff;
    border-radius:15px;
    text-decoration:none;
    font-weight:bold;
    font-size:16px;
    box-shadow:0 0 15px rgba(200,50,255,0.5);
    transition:0.3s;
    text-align:center;
    font-family:'Nosifer', cursive;
    text-shadow:0 0 8px #cc00ff;
}

.vps-card a i{
    margin-right:6px;
}

.vps-card a:hover{
    background:linear-gradient(135deg,#990099,#660066);
    box-shadow:0 0 30px rgba(200,50,255,0.8);
}
</style>
</head>
<body>

<h1>VPS / Hosting</h1>

<div class="vps-grid">

    <!-- RAM 2GB -->
    <div class="vps-card">
        <div class="vps-icon"><i class="fas fa-memory"></i></div>
        <div class="vps-name">VPS RAM 2GB</div>
        <div class="vps-price">Rp 10.000 / bulan</div>
        <a href="https://wa.me/6282178289756?text=Halo,%20saya%20mau%20beli%20VPS%20RAM%202GB" target="_blank">
            <i class="fas fa-server"></i> Beli Sekarang
        </a>
    </div>

    <!-- RAM 4GB -->
    <div class="vps-card">
        <div class="vps-icon"><i class="fas fa-microchip"></i></div>
        <div class="vps-name">VPS RAM 4GB</div>
        <div class="vps-price">Rp 20.000 / bulan</div>
        <a href="https://wa.me/6282178289756?text=Halo,%20saya%20mau%20beli%20VPS%20RAM%204GB" target="_blank">
            <i class="fas fa-server"></i> Beli Sekarang
        </a>
    </div>

    <!-- RAM 6GB -->
    <div class="vps-card">
        <div class="vps-icon"><i class="fas fa-network-wired"></i></div>
        <div class="vps-name">VPS RAM 6GB</div>
        <div class="vps-price">Rp 30.000 / bulan</div>
        <a href="https://wa.me/6282178289756?text=Halo,%20saya%20mau%20beli%20VPS%20RAM%206GB" target="_blank">
            <i class="fas fa-server"></i> Beli Sekarang
        </a>
    </div>

    <!-- RAM 8GB -->
    <div class="vps-card">
        <div class="vps-icon"><i class="fas fa-server"></i></div>
        <div class="vps-name">VPS RAM 8GB</div>
        <div class="vps-price">Rp 40.000 / bulan</div>
        <a href="https://wa.me/6282178289756?text=Halo,%20saya%20mau%20beli%20VPS%20RAM%208GB" target="_blank">
            <i class="fas fa-server"></i> Beli Sekarang
        </a>
    </div>

    <!-- RAM 16GB -->
    <div class="vps-card">
        <div class="vps-icon"><i class="fas fa-database"></i></div>
        <div class="vps-name">VPS RAM 16GB</div>
        <div class="vps-price">Rp 55.000 / bulan</div>
        <a href="https://wa.me/6282178289756?text=Halo,%20saya%20mau%20beli%20VPS%20RAM%2016GB" target="_blank">
            <i class="fas fa-server"></i> Beli Sekarang
        </a>
    </div>

</div>

<script>
// cek login
if(localStorage.getItem("isLoggedIn")!=="true"){

</script>

</body>
</html>
