<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jual APK Premium</title>

<!-- Font menyeramkan -->
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Nosifer&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
body{
    background:black;
    font-family:'Nosifer', cursive;
    color:#cc00ff;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#cc00ff;
    text-shadow:0 0 12px #cc00ff;
}

/* GRID LIST APK */
.apk-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:20px;
}

/* CARD APK */
.apk-card{
    background: rgba(128,0,128,0.05);
    border-radius:20px;
    box-shadow:0 0 25px rgba(200,50,255,0.4);
    text-align:center;
    padding:15px;
    transition:0.3s;
    cursor:pointer;
}

/* HOVER EFFECT */
.apk-card:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(200,50,255,0.6);
}

/* NAMA APK */
.apk-card .apk-name{
    font-weight:bold;
    color:#cc00ff;
    margin-bottom:10px;
    font-family:'Nosifer', cursive;
    text-shadow:0 0 8px #cc00ff;
}

/* LOGO APK */
.apk-card .apk-logo{
    width:60px;
    height:60px;
    object-fit:contain;
    margin-bottom:10px;
}

/* HARGA */
.apk-card .apk-price{
    font-weight:bold;
    color:#ffcc00;
    margin-bottom:10px;
    font-family:'UnifrakturCook', cursive;
    text-shadow:0 0 6px #ffcc00;
}

/* TOMBOL KOTAK (FULL CARD BUTTON) */
.apk-card a{
    display:block;
    padding:20px 10px;
    background:linear-gradient(135deg,#660066,#330033);
    color:#cc00ff;
    border-radius:15px;
    text-decoration:none;
    font-weight:bold;
    font-size:14px;
    box-shadow:0 0 15px rgba(200,50,255,0.4);
    transition:0.3s;
    text-align:center;
    font-family:'Nosifer', cursive;
    text-shadow:0 0 8px #cc00ff;
}

.apk-card a i{
    margin-right:6px;
}

.apk-card a:hover{
    background:#330033;
    box-shadow:0 0 25px rgba(200,50,255,0.6);
}
</style>
</head>
<body>

<h1> APK Premium</h1>

<div class="apk-grid">

    <!-- Alight Motion -->
    <div class="apk-card">
        <div class="apk-name">Alight Motion</div>
        <img src="https://files.catbox.moe/0lve1x.jpg" alt="Logo Alight Motion" class="apk-logo">
        <div class="apk-price">Rp 25.000 1 TAHUN</div>
        <a href="https://wa.me/6282178289756?text=Halo,%20saya%20mau%20beli%20Alight%20Motion" target="_blank">
            <i class="fas fa-coins"></i> Beli Sekarang
        </a>
    </div>

    <!-- CapCut -->
    <div class="apk-card">
        <div class="apk-name">CapCut</div>
        <img src="https://files.catbox.moe/2jy5ca.jpg" alt="Logo CapCut" class="apk-logo">
        <div class="apk-price">Rp 20.000 1 BULAN</div>
        <a href="https://wa.me/6282178289756?text=Halo,%20saya%20mau%20beli%20CapCut" target="_blank">
            <i class="fas fa-coins"></i> Beli Sekarang
        </a>
    </div>

    <!-- Canva -->
    <div class="apk-card">
        <div class="apk-name">Canva</div>
        <img src="https://files.catbox.moe/8trlgl.jpg" alt="Logo Canva" class="apk-logo">
        <div class="apk-price">Rp 15.000 1 BULAN</div>
        <a href="https://wa.me/6282178289756?text=Halo,%20saya%20mau%20beli%20Canva" target="_blank">
            <i class="fas fa-coins"></i> Beli Sekarang
        </a>
    </div>

    <!-- Netflix -->
    <div class="apk-card">
        <div class="apk-name">Netflix</div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Logo Netflix" class="apk-logo">
        <div class="apk-price">Rp 150.000 1 TAHUN</div>
        <a href="https://wa.me/6282178289756?text=Halo,%20saya%20mau%20beli%20Netflix" target="_blank">
            <i class="fas fa-coins"></i> Beli Sekarang
        </a>
    </div>

    <!-- Telegram -->
    <div class="apk-card">
        <div class="apk-name">Telegram</div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Logo Telegram" class="apk-logo">
        <div class="apk-price">Rp 50.000 PERMANEN</div>
        <a href="https://wa.me/6282178289756?text=Halo,%20saya%20mau%20beli%20Telegram" target="_blank">
            <i class="fas fa-coins"></i> Beli Sekarang
        </a>
    </div>

</div>

</body>
</html>
