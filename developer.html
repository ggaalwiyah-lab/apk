<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nosifer&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
body{
    background:black;
    color:#cc00ff;
    font-family:'Nosifer', cursive;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:400px;
    background:rgba(128,0,128,0.05);
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 40px rgba(200,50,255,0.6);
    text-align:center;
}

h2{
    font-family:'Creepster', cursive;
    font-size:32px;
    margin-bottom:25px;
    color:#ff4444;
    text-shadow:0 0 15px red;
}

.contact-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:15px;
    background:linear-gradient(45deg,#660066,#330033);
    color:#cc00ff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    box-shadow:0 0 25px rgba(200,50,255,0.5);
    transition:0.2s;
    font-family:'Creepster', cursive;
}

.contact-btn i{
    font-size:22px;
}

.contact-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 45px rgba(200,50,255,0.8);
}

.back-btn{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#8b0000,#660066);
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-family:'Creepster', cursive;
    box-shadow:0 0 20px red;
}

.back-btn:hover{
    box-shadow:0 0 35px red;
    transform:translateY(-2px);
}
</style>
</head>
<body>

<div class="container">
    <h2>Developer</h2>

    <a class="contact-btn" href="https://wa.me/6282178289756" target="_blank">
        <i class="fab fa-whatsapp"></i> WhatsApp
    </a>

    <a class="contact-btn" href="https://t.me/Ranxyz_Official" target="_blank">
        <i class="fab fa-telegram"></i> Telegram
    </a>

    <a class="contact-btn" href="https://t.me/Ranxyz_Channel" target="_blank">
        <i class="fas fa-bullhorn"></i> Saluran Telegram
    </a>

    <button class="back-btn" onclick="back()">Kembali</button>
</div>

<script>
let user = JSON.parse(localStorage.getItem("currentUser"));
if(!user){
    window.location.href="login.html";
}

function back(){
    window.location.href="dasboard.html";
}
</script>

</body>
</html>
